<style>

  *{box-sizing:border-box;margin:0;padding:0;}
  body{ font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif; background:var(--bg); color:var(--ink); line-height:1.7; -webkit-text-size-adjust:100%; }

  .tool-card{ display:block; background:#fff; border:1px solid var(--line); border-radius:12px; padding:20px; margin-bottom:16px; text-decoration:none; color:var(--ink); }

  .tool-card h2{ font-size:1.15rem; color:var(--jade-dark); margin-bottom:4px; }
  .tool-card p{ color:var(--gray); font-size:.95rem; }
  footer{ text-align:center; color:var(--gray); font-size:.85rem; padding:0 16px 32px; }

  </a>
